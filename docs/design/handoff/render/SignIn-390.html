<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in, mobile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Inter:wght@400..700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EDE9DF}
h1,h2,h3,p,ul,ol,figure,dl,dd,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
a{color:#161A1D}a:hover{color:#0F5A47}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid #0F5A47;outline-offset:2px}
</style>
</head><body>

<div id="top" style="max-width: 390px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: #FAF8F3; color: #161A1D; font-family: Inter, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.5">

  <header style="padding: 0 20px; border-bottom: 1px solid #E3DED2; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <a href="Landing-390.dc.html" aria-label="Bidfolio home" style="display: flex; align-items: baseline; gap: 7px; text-decoration: none; color: #161A1D">
      <svg viewBox="0 0 24 32" width="15" height="20" aria-hidden="true"><path fill="#0F5A47" d="M0 11.022L4.393 15.415 19.808 0H22a2 2 0 0 1 2 2v28a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2ZM0 6.213 15 0 4.393 10.607Z"></path></svg>
      <span style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 22px; line-height: 1; letter-spacing: -0.015em; font-variation-settings: 'opsz' 32">Bidfolio</span>
    </a>
    <a href="SignUp-390.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 500; text-decoration: underline; text-decoration-color: #0F5A47; text-underline-offset: 3px">Create an account</a>
  </header>

  <main style="padding: 24px 20px 36px; display: flex; flex-direction: column">

    <div style="background: #FFFFFF; border: 1px solid #E3DED2; border-radius: 10px; padding: 24px 20px 24px; display: flex; flex-direction: column">
      <h1 style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: -0.015em">Sign in</h1>

      <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="m-si-email" style="font-size: 14px; font-weight: 600">Work email</label>
          <input id="m-si-email" type="email" placeholder="name@company.co.uk" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #161A1D; background: #FFFFFF; border: 1px solid #857F70; border-radius: 6px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="m-si-password" style="font-size: 14px; font-weight: 600">Password</label>
          <input id="m-si-password" type="password" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 14px; font-family: inherit; font-size: 16px; color: #161A1D; background: #FFFFFF; border: 1px solid #857F70; border-radius: 6px">
        </div>
      </div>

      <a href="#" style="align-self: flex-start; margin-top: 2px; display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; text-decoration: underline; text-decoration-color: #0F5A47; text-underline-offset: 3px">Forgot your password?</a>

      <a href="Radar-390.dc.html" style="margin-top: 6px; box-sizing: border-box; min-height: 52px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none; color: #FFFFFF; background: #0F5A47; border-radius: 6px">Sign in</a>
    </div>

    <p style="margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 6px; min-height: 44px; font-size: 15px"><span>New to Bidfolio?</span><a href="Find-390.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: underline; text-decoration-color: #0F5A47; text-underline-offset: 3px">Find your company</a></p>

  </main>

  <footer style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 20px 28px">
    <p style="padding-top: 16px; border-top: 1px solid #E3DED2; font-size: 13px; line-height: 1.6; color: #5A6165">Bidfolio is an independent service and is not affiliated with, or endorsed by, the UK Government.</p>
  </footer>

</div>
</body></html>
